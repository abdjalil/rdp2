name: Setup RDP + SSH on Linux (via Tailscale)

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target host (Tailscale IP or MagicDNS name)'
        required: true
        default: '100.x.x.x'
      ssh_user:
        description: 'SSH username on the target'
        required: true
        default: 'ubuntu'
      ssh_port:
        description: 'SSH port'
        required: false
        default: '22'
      desktop:
        description: 'Desktop environment to install'
        required: true
        type: choice
        default: 'xfce'
        options:
          - xfce
          - gnome
          - kde
          - lxqt
          - none
      enable_rdp:
        description: 'Install and enable xrdp?'
        required: true
        type: boolean
        default: true
      enable_ssh:
        description: 'Ensure SSH server is enabled?'
        required: true
        type: boolean
        default: true
      use_tailscale_ssh:
        description: 'Enable Tailscale SSH (bypasses OpenSSH)?'
        required: true
        type: boolean
        default: false

jobs:
  setup-remote:
    name: Provision RDP/SSH on ${{ inputs.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 1. Checkout repo (optional) ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. Join the tailnet with auth key ----------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          auth-key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tags: tag:ci
          ping: ${{ inputs.host }}

      # ---------- 3. Prepare SSH key ----------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.host }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # ---------- 4. Run provisioning script remotely ----------
      - name: Provision RDP + SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.ssh_user }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            DESKTOP="${{ inputs.desktop }}"
            ENABLE_RDP="${{ inputs.enable_rdp }}"
            ENABLE_SSH="${{ inputs.enable_ssh }}"
            USE_TS_SSH="${{ inputs.use_tailscale_ssh }}"

            echo "▶ Detecting distro..."
            if [ -f /etc/os-release ]; then . /etc/os-release; else echo "No os-release"; exit 1; fi
            echo "Distro: $ID $VERSION_ID"

            case "$ID" in
              ubuntu|debian|pop|linuxmint) PKG=apt; sudo apt update -y ;;
              fedora|rhel|centos|rocky|almalinux) PKG=dnf ;;
              arch|manjaro) PKG=pacman ;;
              *) echo "Unsupported distro: $ID"; exit 1 ;;
            esac

            install() {
              case "$PKG" in
                apt)    sudo DEBIAN_FRONTEND=noninteractive apt install -y "$@" ;;
                dnf)    sudo dnf install -y "$@" ;;
                pacman) sudo pacman -Sy --noconfirm "$@" ;;
              esac
            }

            # --------- SSH server ---------
            if [ "$ENABLE_SSH" = "true" ]; then
              echo "▶ Ensuring OpenSSH server..."
              case "$PKG" in
                apt)    install openssh-server ;;
                dnf)    install openssh-server ;;
                pacman) install openssh ;;
              esac
              sudo systemctl enable --now ssh 2>/dev/null || sudo systemctl enable --now sshd
            fi

            # --------- Desktop + xrdp ---------
            if [ "$ENABLE_RDP" = "true" ]; then
              echo "▶ Installing desktop: $DESKTOP"
              case "$DESKTOP" in
                xfce)
                  case "$PKG" in
                    apt)    install xfce4 xfce4-goodies dbus-x11 ;;
                    dnf)    sudo dnf groupinstall -y "Xfce Desktop" ;;
                    pacman) install xfce4 xfce4-goodies ;;
                  esac
                  SESSION="xfce4-session"
                  ;;
                gnome)
                  case "$PKG" in
                    apt)    install ubuntu-desktop-minimal gnome-session dbus-x11 ;;
                    dnf)    sudo dnf groupinstall -y "Workstation" ;;
                    pacman) install gnome gnome-extra ;;
                  esac
                  SESSION="gnome-session"
                  ;;
                kde)
                  case "$PKG" in
                    apt)    install kde-plasma-desktop dbus-x11 ;;
                    dnf)    sudo dnf groupinstall -y "KDE Plasma Workspaces" ;;
                    pacman) install plasma-meta kde-applications ;;
                  esac
                  SESSION="startplasma-x11"
                  ;;
                lxqt)
                  case "$PKG" in
                    apt)    install lxqt-core dbus-x11 ;;
                    dnf)    sudo dnf groupinstall -y "LXQt Desktop" ;;
                    pacman) install lxqt ;;
                  esac
                  SESSION="startlxqt"
                  ;;
                none) SESSION="" ;;
              esac

              echo "▶ Installing xrdp..."
              case "$PKG" in
                apt)    install xrdp ;;
                dnf)    install xrdp ;;
                pacman) install xrdp ;;
              esac

              if [ -n "$SESSION" ]; then
                echo "$SESSION" > "$HOME/.xsession"
                chmod +x "$HOME/.xsession"
                echo "▶ ~/.xsession → $SESSION"
              fi

              if [ "$PKG" = "apt" ]; then
                sudo adduser xrdp ssl-cert || true
                sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla >/dev/null <<'EOF'
            [Allow Colord all Users]
            Identity=unix-user:*
            Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
            ResultAny=no
            ResultInactive=no
            ResultActive=yes
            EOF
              fi

              sudo systemctl enable --now xrdp
              sudo systemctl restart xrdp
            fi

            # --------- Firewall ---------
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 22/tcp || true
              [ "$ENABLE_RDP" = "true" ] && sudo ufw allow 3389/tcp || true
              sudo ufw allow in on tailscale0 || true
            fi

            # --------- Tailscale on the target ---------
            if ! command -v tailscale >/dev/null 2>&1; then
              echo "▶ Installing Tailscale..."
              curl -fsSL https://tailscale.com/install.sh | sh
            fi

            if [ "$USE_TS_SSH" = "true" ]; then
              echo "▶ Enabling Tailscale SSH..."
              sudo tailscale up --ssh --accept-routes || sudo tailscale set --ssh
            fi

            echo "✅ Setup complete"
            TSIP="$(tailscale ip -4 2>/dev/null | head -1 || true)"
            echo "Tailscale IP: ${TSIP:-run 'sudo tailscale up' on target}"
            echo "SSH: ssh $USER@${TSIP:-<ip>}"
            echo "RDP: connect to ${TSIP:-<ip>}:3389"
