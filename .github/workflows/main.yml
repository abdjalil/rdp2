name: Get Tailscale RDP/SSH Link

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: 'Tailscale machine name (e.g. my-linux-box)'
        required: true
        default: 'my-linux-box'

jobs:
  get-link:
    name: Resolve Tailscale address for ${{ inputs.target_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          auth-key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tags: tag:ci

      - name: Resolve target and print connection info
        id: resolve
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target_name }}"

          for i in $(seq 1 12); do
            tailscale status --json > /tmp/ts.json 2>/dev/null && break
            sleep 5
          done

          IP=$(jq -r --arg t "$TARGET" '
            .Peer[]?
            | select(
                (.DNSName // "" | sub("\\.$";"")) as $dns
                | (.HostName // "")
                | . == $t
                or $dns == $t
                or ($dns | startswith($t + "."))
              )
            | .TailscaleIPs[0]
          ' /tmp/ts.json | head -n1)

          if [ -z "$IP" ] || [ "$IP" = "null" ]; then
            echo "❌ '$TARGET' not found. Available peers:"
            jq -r '.Peer[]? | "  - \(.HostName)  (\(.TailscaleIPs[0]))  [\(.OS)]"' /tmp/ts.json
            exit 1
          fi

          DNS=$(jq -r --arg t "$TARGET" '
            .Peer[]?
            | select(
                (.DNSName // "" | sub("\\.$";"")) as $dns
                | (.HostName // "")
                | . == $t or $dns == $t or ($dns | startswith($t + "."))
              )
            | .DNSName
          ' /tmp/ts.json | head -n1 | sed 's/\.$//')

          echo "ip=$IP"   >> "$GITHUB_OUTPUT"
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"

      - name: Print connection links
        run: |
          IP="${{ steps.resolve.outputs.ip }}"
          DNS="${{ steps.resolve.outputs.dns }}"

          {
            echo "# 🔗 Connection Links for \`${{ inputs.target_name }}\`"
            echo ""
            echo "## 🌐 Tailscale IP"
            echo '```'
            echo "$IP"
            echo '```'
            echo ""
            echo "## 🖥️ SSH — PuTTY / terminal"
            echo '```'
            echo "ssh <your-user>@$IP"
            echo "# or MagicDNS:"
            echo "ssh <your-user>@$DNS"
            echo '```'
            echo ""
            echo "### PuTTY fields"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Host Name | \`$IP\` |"
            echo "| Port | \`22\` |"
            echo "| Connection type | SSH |"
            echo ""
            echo "## 🪟 RDP — Windows mstsc"
            echo '```'
            echo "mstsc /v:$IP:3389"
            echo "# or MagicDNS:"
            echo "mstsc /v:$DNS:3389"
            echo '```'
            echo ""
            echo "### Remote Desktop fields"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Computer | \`$IP:3389\` |"
            echo "| Username | *your Linux user* |"
            echo "| Password | *your Linux password* |"
            echo ""
            echo "## 📋 Copy-paste"
            echo '```'
            echo "SSH: ssh <user>@$IP"
            echo "RDP: mstsc /v:$IP:3389"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "════════════════════════════════════════"
          echo " Tailscale IP : $IP"
          echo " MagicDNS     : $DNS"
          echo " SSH          : ssh <user>@$IP"
          echo " RDP          : mstsc /v:$IP:3389"
          echo "════════════════════════════════════════"
